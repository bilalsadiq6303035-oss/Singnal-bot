name: Auto Signal Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # ہر 5 منٹ بعد خود بخود چلے گا
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run bot script
        run: python bot.py
